apiVersion: apps/v1
kind: Deployment
metadata:
  name: climapulse
  labels:
    app: climapulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: climapulse
  template:
    metadata:
      labels:
        app: climapulse
    spec:
      containers:
        - name: climapulse
          # Image from the container registry (see M5). Tagged and pushed with:
          #   docker tag climapulse:latest ghcr.io/<your-account>/climapulse:latest
          #   docker push ghcr.io/<your-account>/climapulse:latest
          image: ghcr.io/skit-devops-2026/climapulse:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi