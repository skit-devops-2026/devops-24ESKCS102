# Prometheus configuration for ClimaPulse.
# When running with docker-compose the app resolves at `web:8080`.
# For a remote/cloud deployment, replace the target with the live host.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "climapulse"
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8080"]
        labels:
          service: climapulse
          env: local

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]